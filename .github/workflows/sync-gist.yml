name: Sync script to Gist

on:
  push:
    branches: [master]
    paths:
      - "Enhanced Keka Log Duration by UV with Advanced Notifications.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Gist
        env:
          TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ffc09708226db8bef988a0ecf1848518
          SCRIPT_PATH: "Enhanced Keka Log Duration by UV with Advanced Notifications.js"
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::GIST_TOKEN secret is not set. Create a PAT with the 'gist' scope and add it as repo secret GIST_TOKEN."
            exit 1
          fi
          jq -n --rawfile c "$SCRIPT_PATH" \
            '{files: {"KekaEnhance.js": {content: $c}}}' > body.json
          curl -sSf -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d @body.json \
            "https://api.github.com/gists/$GIST_ID" > /dev/null
          echo "Gist $GIST_ID updated from $SCRIPT_PATH"
